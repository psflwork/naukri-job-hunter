# Regular hunt: full-time remote roles.  Run with:  ./run.sh
# `./run.sh setup` fills in resume_path, experience_years and queries for you.

profile_name: Remote jobs

# Path to your resume PDF (absolute, or relative to this folder).
# Leave empty to auto-pick the first PDF in this folder.
resume_path: ""

# Your total experience in years (used for the search filter + scoring).
experience_years: 8

# Each query is searched separately; results are merged and de-duplicated.
queries:
  - senior software engineer
  - full stack developer
  - technical lead
  - engineering manager
  - solution architect
  - principal engineer

# Job types to keep: full_time, part_time, freelance, contract ([] = any).
# Change per run with --job-type, or save with ./run.sh prefs (also for skills, roles, location, work mode).
job_types: []

search:
  work_modes: [remote]     # remote, hybrid, office ([] = any)
  locations: []            # cities, e.g. [Bengaluru, Pune] ([] = anywhere)
  job_age_days: 7          # only jobs posted in the last N days (1, 3, 7, 15, 30)
  max_pages_per_query: 3   # 20 jobs per page
  min_delay_seconds: 3     # polite random delay between page loads
  max_delay_seconds: 7
  headless: false          # Naukri often blocks headless browsers; keep false if searches return 0

# Title words worth full title points (strong_titles) or partial points (target_titles).
strong_titles:
  - manager
  - architect
  - head
  - principal
target_titles:
  - lead
  - senior
  - engineer
  - developer
  - director

# Jobs whose title contains any of these are dropped - add stacks/roles you don't want.
exclude_title_keywords:
  - sales
  - business development
  - recruiter
  - hr
  - mainframe
  - salesforce
  - sfdc
  - servicenow

# Companies you never want to see.
exclude_companies: []

# Core skills from your resume - edit to match yours. Matches in job tags/description drive
# the skill score (job tags that appear anywhere in your resume also count automatically).
skills:
  - python
  - fastapi
  - node.js
  - nodejs
  - react
  - reactjs
  - typescript
  - javascript
  - angular
  - aws
  - azure devops
  - kubernetes
  - docker
  - ci/cd
  - postgresql
  - mongodb
  - elasticsearch
  - graphql
  - snowflake
  - databricks
  - microservices
  - micro frontend
  - microfrontend
  - generative ai
  - genai
  - llm
  - ai agents
  - prompt engineering
  - mcp
  - agile
  - scrum
  - people management
  - team management
  - stakeholder management
  - solution architecture
  - system design

# Only jobs scoring at least this (0-100) go into the report.
min_score: 50

# Max jobs per run in the report/menu (best scores first), e.g. 10. Empty = no limit.
# Extra matches are not marked as seen, so they show up in later runs.
max_results:

apply:
  max_per_run: 10          # hard cap on auto-applies per CLI run
  max_per_day: 15          # hard cap on auto-applies per day via the MCP agent
  answer_questions: true   # answer recruiter questions from your resume + saved answers (false = leave those jobs to you)

# Email template for `./run.sh contacts` ("Draft email" links).
# Placeholders: {title} {company} {job_url} {name} {experience_years}
outreach:
  name: ""                 # your name; empty = first line of your resume
  subject: "Application for {title} - {name}"
  body: |
    Hi,

    I came across the {title} role at {company} on Naukri ({job_url}) and would like to apply.
    I have {experience_years} years of relevant experience; my resume is attached.

    Looking forward to hearing from you.

    Regards,
    {name}
