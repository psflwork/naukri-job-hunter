# Side-gig hunt: remote part-time / freelance / contract / second-job roles.
# Run with:  ./run.sh side      (or --profile side on any command)

profile_name: Side gigs (part-time / freelance / contract, remote)

# `./run.sh setup` fills these in for you.
resume_path: ""
experience_years: 8

# Naukri has no part-time filter and matches keywords loosely, so plain gig words
# ("freelance", "part time") find the most real gigs; the tech-specific ones add depth.
queries:
  - freelance
  - freelancing
  - part time
  - part time developer
  - contract developer
  - contractual
  - freelance full stack developer
  - freelance python developer
  - freelance react developer
  - part time architect
  - contract solution architect
  - freelance ai engineer

search:
  work_modes: [remote]     # remote, hybrid, office ([] = any)
  locations: []            # cities, e.g. [Bengaluru, Pune] ([] = anywhere)
  experience_filter: null  # no Naukri experience filter; junior gigs are dropped below instead
  job_age_days: 30         # gigs are posted less often; look back further
  max_pages_per_query: 2   # 20 jobs per page; lower = faster, fewer Naukri requests
  min_delay_seconds: 3
  max_delay_seconds: 7
  headless: false

# Job types to keep: full_time, part_time, freelance, contract ([] = any).
# Change per run with --job-type, or save with ./run.sh prefs.
job_types: [part_time, freelance, contract]

# Job types are detected from phrases in the title/tags/description (built-in list in options.py).
# Add your own phrases per type with job_type_keywords, e.g.
#   job_type_keywords:
#     freelance: [freelance, freelancer, per project]
# Words that only count in the job title (too noisy in descriptions):
job_type_title_keywords:
  contract: contract
  weekend: part_time
  consultant: freelance
# Phrases removed before detection (e.g. "contract testing" is not a contract job):
gig_ignore_phrases:
  - contract testing
  - smart contract
  - smart contracts
  - if on contract
  - contract management
  - weekend work
  - weekend support
  - no freelancers
  - not freelance
  - no part time

# Title in strong_titles = full title points; in target_titles = partial.
strong_titles:
  - full stack
  - fullstack
  - full-stack
  - architect
  - python
  - react
  - node
  - fastapi
  - ai
  - genai
  - llm
target_titles:
  - developer
  - engineer
  - programmer
  - lead
  - consultant
  - expert

exclude_title_keywords:
  - sales
  - teacher
  - tutor
  - trainer
  - faculty
  - accountant
  - recruiter
  - recruitment
  - hr
  - video editor
  - customer
  - telecaller
  - chat process
  - bpo
  - data entry
  - content writer
  - marketing
  - seo
  - sap
  - salesforce
  - sfdc
  - servicenow
  - mainframe
  - qa
  - testing
  - wordpress
  - shopify
  - php
  - erp
  - intern
  - fresher

exclude_companies: []

skills:
  - python
  - fastapi
  - node.js
  - nodejs
  - react
  - reactjs
  - react.js
  - typescript
  - javascript
  - angular
  - aws
  - azure
  - kubernetes
  - docker
  - postgresql
  - mongodb
  - elasticsearch
  - graphql
  - snowflake
  - databricks
  - microservices
  - micro frontend
  - rest api
  - full stack
  - generative ai
  - genai
  - llm
  - openai
  - langchain
  - rag
  - ai agents
  - prompt engineering
  - mcp
  - system design
  - solution architecture

# A job needs at least this many of your skills to be scored at all.
min_skill_matches: 1

# Drop gigs whose experience range tops out below this (junior work).
skip_if_max_experience_below: 5

# Salary is ignored; gig type and skills matter most.
weights:
  skills: 45
  gig: 20
  title: 15
  experience: 10
  remote: 10

min_score: 45

# Max jobs per run in the report/menu (best scores first), e.g. 10. Empty = no limit.
# Extra matches are not marked as seen, so they show up in later runs.
max_results:

apply:
  max_per_run: 10
  max_per_day: 15
  answer_questions: true

# Email template for `./run.sh contacts` ("Draft email" links).
# Placeholders: {title} {company} {job_url} {name} {experience_years}
outreach:
  name: ""                 # your name; empty = first line of your resume
  subject: "Application for {title} - {name}"
  body: |
    Hi,

    I came across the {title} role at {company} on Naukri ({job_url}) and would like to apply.
    I have {experience_years} years of relevant experience; my resume is attached.

    Looking forward to hearing from you.

    Regards,
    {name}
